<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Load Game - Crossing Road</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load a Pixel Art Font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'pixel': ['"Press Start 2P"', 'cursive'],
                    },
                    colors: {
                        'game-sky': '#4a90e2', // Inspired by the sky in the theme
                        'game-grass': '#7cb342', // Inspired by the grass
                        'game-road': '#757575', // Inspired by the road
                        'game-wood': '#8d6e63',
                        'game-wood-dark': '#5d4037',
                        'game-yellow': '#fdd835', // Inspired by the title text
                        'game-red': '#e53935',
                        'game-green': '#43a047'
                    },
                    boxShadow: {
                        'pixel': '4px 4px 0px 0px rgba(0, 0, 0, 0.75)',
                        'pixel-sm': '2px 2px 0px 0px rgba(0, 0, 0, 0.75)',
                        'pixel-inset': 'inset 4px 4px 0px 0px rgba(0, 0, 0, 0.3)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            /* Create a simple pixelated pattern background to mimic the game's environment */
            background-color: #7cb342;
            background-image: 
                linear-gradient(45deg, #8bc34a 25%, transparent 25%, transparent 75%, #8bc34a 75%, #8bc34a), 
                linear-gradient(45deg, #8bc34a 25%, transparent 25%, transparent 75%, #8bc34a 75%, #8bc34a);
            background-size: 64px 64px;
            background-position: 0 0, 32px 32px;
            /* Ensure font rendering is crisp for pixel art */
            -webkit-font-smoothing: none;
        }

        /* Utility classes for pixel borders */
        .pixel-border {
            border: 4px solid #000;
        }
        
        .pixel-border-sm {
            border: 2px solid #000;
        }

        /* Custom scrollbar to match the theme */
        ::-webkit-scrollbar {
            width: 16px;
        }
        ::-webkit-scrollbar-track {
            background: #5d4037; 
            border-left: 4px solid #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #8d6e63;
            border: 4px solid #000;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a1887f;
        }

        /* Hover effects for buttons */
        .btn-hover:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px 0px rgba(0, 0, 0, 0.75);
        }
        .btn-active:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px rgba(0, 0, 0, 0.75);
        }
    </style>
</head>

<body class="font-pixel text-white h-screen flex flex-col items-center justify-center overflow-hidden selection:bg-game-yellow selection:text-black">

    <!-- Main Container -->
    <div class="relative w-full max-w-4xl h-5/6 bg-game-sky/90 backdrop-blur-sm pixel-border shadow-pixel flex flex-col p-6 rounded-sm">
        
        <!-- Top decorative border -->
        <div class="absolute top-0 left-0 w-full h-4 bg-white/20"></div>

        <!-- Header -->
        <div class="text-center mb-8 relative z-10 pt-4">
            <h1 class="text-4xl md:text-5xl text-game-yellow drop-shadow-[4px_4px_0_rgba(0,0,0,1)] tracking-widest uppercase">
                Load Game
            </h1>
            <div class="w-3/4 mx-auto h-2 bg-game-yellow border-b-4 border-black mt-4"></div>
        </div>

        <!-- Save Slots Container -->
        <div class="flex-grow overflow-y-auto pr-4 space-y-4" id="save-slots-container">
            <!-- Save Slots will be generated here by JS -->
        </div>

        <!-- Bottom Action Area -->
        <div class="mt-8 flex justify-center z-10">
            <button onclick="goBack()" class="bg-game-wood text-white px-8 py-4 text-xl pixel-border shadow-pixel btn-hover btn-active transition-all duration-100 flex items-center space-x-3">
                <span class="text-game-yellow text-2xl drop-shadow-[2px_2px_0_rgba(0,0,0,1)]">&lt;</span>
                <span class="drop-shadow-[2px_2px_0_rgba(0,0,0,1)]">BACK</span>
            </button>
        </div>
    </div>

    <script>
        // Mock data representing saved games
        const saveGames = [
            { id: 'save1', name: 'ko', playtime: '0m 25s', date: '2026-08-13 10:20:32', level: 'Level 1' },
            { id: 'save2', name: 'Player_One', playtime: '1h 15m', date: '2026-08-12 18:45:10', level: 'Level 5' },
            { id: 'save3', name: 'Shinchan_Pro', playtime: '4h 30m', date: '2026-08-10 09:12:00', level: 'Level 12' },
            { id: 'save4', name: 'Test_Run', playtime: '0m 05s', date: '2026-08-14 14:00:00', level: 'Tutorial' }
        ];

        const container = document.getElementById('save-slots-container');

        // Function to render save slots
        function renderSaveSlots() {
            container.innerHTML = ''; // Clear existing
            
            if (saveGames.length === 0) {
                container.innerHTML = `
                    <div class="bg-black/50 p-8 text-center pixel-border text-game-yellow shadow-pixel">
                        <p class="text-xl drop-shadow-[2px_2px_0_rgba(0,0,0,1)]">NO SAVED GAMES FOUND</p>
                    </div>
                `;
                return;
            }

            saveGames.forEach(save => {
                const slotHTML = `
                    <div class="bg-black/60 p-4 pixel-border shadow-pixel flex flex-col md:flex-row justify-between items-center group hover:bg-black/80 transition-colors duration-200">
                        
                        <!-- Save Info -->
                        <div class="flex-grow mb-4 md:mb-0 w-full md:w-auto">
                            <h3 class="text-xl text-game-yellow mb-2 drop-shadow-[2px_2px_0_rgba(0,0,0,1)] truncate" title="${save.name}">${save.name}</h3>
                            <div class="text-xs text-gray-300 space-y-1">
                                <p><span class="text-gray-400">Playtime:</span> ${save.playtime}</p>
                                <p><span class="text-gray-400">Date:</span> ${save.date}</p>
                                <p><span class="text-gray-400">Area:</span> <span class="text-white">${save.level}</span></p>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex space-x-4 w-full md:w-auto justify-end">
                            <button onclick="loadGame('${save.id}')" class="bg-game-green text-white px-4 py-3 text-sm pixel-border-sm shadow-pixel-sm btn-hover btn-active transition-all duration-100 flex items-center justify-center min-w-[100px]">
                                <span class="drop-shadow-[1px_1px_0_rgba(0,0,0,1)]">LOAD</span>
                            </button>
                            <button onclick="deleteGame('${save.id}')" class="bg-game-red text-white px-4 py-3 text-sm pixel-border-sm shadow-pixel-sm btn-hover btn-active transition-all duration-100 flex items-center justify-center min-w-[100px]">
                                <span class="drop-shadow-[1px_1px_0_rgba(0,0,0,1)]">DELETE</span>
                            </button>
                        </div>
                    </div>
                `;
                container.innerHTML += slotHTML;
            });
        }

        // Mock interaction functions
        function loadGame(id) {
            // Replace alert with a visual cue in a real app, but for demonstration:
            console.log(`Loading game: ${id}`);
            
            // Example of visual feedback without alert
            const slot = event.target.closest('.pixel-border');
            if(slot) {
                const originalBg = slot.style.backgroundColor;
                slot.style.backgroundColor = '#43a047'; // Flash green
                setTimeout(() => {
                    slot.style.backgroundColor = originalBg;
                }, 200);
            }
        }

        function deleteGame(id) {
             console.log(`Deleting game: ${id}`);
             // Simulate deleting the item from the array and re-rendering
             const index = saveGames.findIndex(game => game.id === id);
             if (index > -1) {
                 // Add a little exit animation effect before removing
                 const slot = event.target.closest('.pixel-border');
                 if(slot) {
                     slot.style.opacity = '0.5';
                     slot.style.backgroundColor = '#e53935'; // Flash red
                     setTimeout(() => {
                         saveGames.splice(index, 1);
                         renderSaveSlots();
                     }, 300);
                 }
             }
        }

        function goBack() {
             console.log("Going back to main menu");
             // Add logic to navigate back
        }

        // Initialize the UI on load
        window.onload = () => {
            renderSaveSlots();
        };
    </script>
</body>
</html>
